# coturn config for the relay. Copy to /etc/turnserver.conf (or /etc/coturn/turnserver.conf).
#
# Clients never see a static password: the relay API hands out credentials that expire
# (TURN REST API scheme). static-auth-secret below must equal TURN_SECRET in relay-server/.env.
# Generate one with: openssl rand -hex 32

listening-port=3478
tls-listening-port=5349

# Short-lived credentials from the relay API.
use-auth-secret
static-auth-secret=CHANGE_ME_SAME_AS_TURN_SECRET
realm=relay.example.com

# TLS for turns: (helps on networks that block UDP). Point these at a certificate for the realm.
# With Caddy on the same host, copy its cert/key somewhere coturn can read after each renewal,
# or run certbot separately. Comment out tls-listening-port above if you skip TLS.
cert=/etc/coturn/certs/relay.example.com.crt
pkey=/etc/coturn/certs/relay.example.com.key
no-tlsv1
no-tlsv1_1

fingerprint
no-cli
no-multicast-peers

# Relay only to public addresses: stop clients using TURN to reach this host's loopback or private network.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Limit abuse: per-allocation bandwidth and total allocations.
max-bps=3000000
total-quota=100
user-quota=12

# Media relay port range (open these UDP ports in the firewall).
min-port=49152
max-port=65535

# No logs of peers or IPs.
no-stdout-log
log-file=/dev/null
