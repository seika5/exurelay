# Builds relay-web as a static site and publishes it to GitHub Pages: the official app, or your fork's own.
# Each run publishes the commit and a SHA-256 over every file (out/build.json, also in the run summary), and the
# app shows both in Settings → General, so anyone can check what they're running (DESIGN.md §9).
#
# One-time setup: repository Settings → Pages → Source: "GitHub Actions". With a custom domain the app is served at
# its root; otherwise under /<repository>, which BASE_PATH handles.
name: Deploy web app

on:
  push:
    branches: [main]
    paths: ["relay-web/**", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay-web/package-lock.json
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: npm ci
      # Includes the protocol test vectors: a change that breaks messaging with everyone else fails here.
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Publish the build hash
        run: |
          cat out/build.json
          {
            echo "### Exurelay web build"
            echo '```json'
            cat out/build.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: relay-web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
