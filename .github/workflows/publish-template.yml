# Publishes relay-server/deploy/aws-lightsail.yaml to a public S3 bucket, so the README's "Launch Stack" link opens
# CloudFormation with it filled in (CloudFormation only loads templates from S3). Forks publish their own: the
# template's RepoUrl default is set to this repository, so their servers install their code.
#
# One-time setup (repository Settings -> Secrets and variables -> Actions -> Variables):
#   TEMPLATE_BUCKET        an S3 bucket whose objects are publicly readable (a bucket policy allowing s3:GetObject)
#   AWS_TEMPLATE_ROLE_ARN  an IAM role this repository can assume through GitHub's OIDC provider, allowed
#                          s3:PutObject on that bucket
#   TEMPLATE_REGION        the bucket's region (optional, default us-east-2)
# .github/setup-template-publishing.sh does all of this. Until both are set, this workflow skips. The run summary
# prints the Launch Stack link.
name: Publish Lightsail template

on:
  push:
    branches: [main]
    paths: ["relay-server/deploy/aws-lightsail.yaml", ".github/workflows/publish-template.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: vars.TEMPLATE_BUCKET != '' && vars.AWS_TEMPLATE_ROLE_ARN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_TEMPLATE_ROLE_ARN }}
          aws-region: ${{ vars.TEMPLATE_REGION || 'us-east-2' }}
      - name: Upload
        env:
          BUCKET: ${{ vars.TEMPLATE_BUCKET }}
          REGION: ${{ vars.TEMPLATE_REGION || 'us-east-2' }}
          REPO_URL: https://github.com/${{ github.repository }}.git
        run: |
          sed "s|Default: https://github.com/seika5/relay.git|Default: $REPO_URL|" relay-server/deploy/aws-lightsail.yaml > aws-lightsail.yaml
          grep -q "Default: $REPO_URL" aws-lightsail.yaml
          aws s3 cp aws-lightsail.yaml "s3://$BUCKET/aws-lightsail.yaml" --content-type text/yaml --cache-control max-age=300
          url="https://$BUCKET.s3.$REGION.amazonaws.com/aws-lightsail.yaml"
          {
            echo "Template: $url"
            echo
            echo "Launch Stack link: https://console.aws.amazon.com/cloudformation/home#/stacks/quickcreate?templateURL=$url&stackName=relay"
          } >> "$GITHUB_STEP_SUMMARY"
